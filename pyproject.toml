[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surgview-vla-preview"
version = "0.1.0"
description = "Selected core method components for SurgView-VLA"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.6,<3"]

[tool.setuptools.packages.find]
include = ["surgview_vla*"]
